<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STYLE 2: Holographic Display - NCORE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        :root {
            --primary: #00ff88;
            --secondary: #00d4ff;
            --accent: #ff0080;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background:
                linear-gradient(0deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 50px 50px;
            }
        }

        /* Holographic Frame */
        .holo-frame {
            position: relative;
            padding: 3rem;
            perspective: 1000px;
        }

        .holo-border {
            position: absolute;
            border: 3px solid var(--primary);
            box-shadow:
                0 0 20px var(--primary),
                inset 0 0 20px rgba(0, 255, 136, 0.2);
            animation: borderPulse 2s ease-in-out infinite;
        }

        @keyframes borderPulse {

            0%,
            100% {
                box-shadow:
                    0 0 20px var(--primary),
                    inset 0 0 20px rgba(0, 255, 136, 0.2);
            }

            50% {
                box-shadow:
                    0 0 40px var(--primary),
                    inset 0 0 40px rgba(0, 255, 136, 0.4);
            }
        }

        .border-top {
            top: 0;
            left: 20%;
            right: 20%;
            height: 0;
        }

        .border-bottom {
            bottom: 0;
            left: 20%;
            right: 20%;
            height: 0;
        }

        .border-left {
            left: 0;
            top: 20%;
            bottom: 20%;
            width: 0;
        }

        .border-right {
            right: 0;
            top: 20%;
            bottom: 20%;
            width: 0;
        }

        /* Corner Brackets */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid var(--secondary);
            box-shadow: 0 0 15px var(--secondary);
        }

        .corner-tl {
            top: 0;
            left: 0;
            border-right: none;
            border-bottom: none;
        }

        .corner-tr {
            top: 0;
            right: 0;
            border-left: none;
            border-bottom: none;
        }

        .corner-bl {
            bottom: 0;
            left: 0;
            border-right: none;
            border-top: none;
        }

        .corner-br {
            bottom: 0;
            right: 0;
            border-left: none;
            border-top: none;
        }

        /* Content */
        .holo-content {
            position: relative;
            transform-style: preserve-3d;
            animation: holoRotate 10s ease-in-out infinite;
        }

        @keyframes holoRotate {

            0%,
            100% {
                transform: rotateY(0deg) rotateX(0deg);
            }

            25% {
                transform: rotateY(2deg) rotateX(1deg);
            }

            50% {
                transform: rotateY(0deg) rotateX(2deg);
            }

            75% {
                transform: rotateY(-2deg) rotateX(1deg);
            }
        }

        /* Title */
        .holo-title {
            font-size: clamp(3rem, 8vw, 7rem);
            font-weight: 900;
            text-align: center;
            position: relative;
            letter-spacing: 10px;
            margin-bottom: 2rem;
        }

        .holo-title span {
            display: inline-block;
            background: linear-gradient(180deg,
                    var(--primary) 0%,
                    var(--secondary) 50%,
                    var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: letterGlitch 3s ease-in-out infinite;
            text-shadow:
                0 0 30px rgba(0, 255, 136, 0.8),
                0 0 60px rgba(0, 212, 255, 0.6);
        }

        .holo-title span:nth-child(even) {
            animation-delay: -1.5s;
        }

        @keyframes letterGlitch {

            0%,
            90%,
            100% {
                transform: translateZ(0);
            }

            92% {
                transform: translateZ(20px) translateX(-2px);
            }

            94% {
                transform: translateZ(-20px) translateX(2px);
            }

            96% {
                transform: translateZ(10px) translateY(-2px);
            }
        }

        /* Scanline Effect */
        .scanline {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg,
                    transparent,
                    var(--primary),
                    transparent);
            top: 0;
            left: 0;
            animation: scan 4s linear infinite;
            box-shadow: 0 0 10px var(--primary);
        }

        @keyframes scan {
            0% {
                top: 0%;
            }

            100% {
                top: 100%;
            }
        }

        /* Categories */
        .holo-categories {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-top: 3rem;
        }

        .holo-badge {
            position: relative;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 3px;
            border: 2px solid var(--primary);
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
            background: rgba(0, 255, 136, 0.1);
            box-shadow:
                0 0 20px rgba(0, 255, 136, 0.3),
                inset 0 0 20px rgba(0, 255, 136, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .holo-badge:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow:
                0 0 40px rgba(0, 255, 136, 0.6),
                inset 0 0 30px rgba(0, 255, 136, 0.2);
            background: rgba(0, 255, 136, 0.2);
        }

        .holo-badge::before {
            content: '▸';
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            animation: arrow 1s ease-in-out infinite;
        }

        @keyframes arrow {

            0%,
            100% {
                left: 10px;
            }

            50% {
                left: 15px;
            }
        }

        /* Holographic Particles */
        .holo-particle {
            position: absolute;
            width: 2px;
            height: 20px;
            background: linear-gradient(180deg, var(--primary), transparent);
            box-shadow: 0 0 5px var(--primary);
            animation: holoParticle 3s infinite;
        }

        @keyframes holoParticle {
            0% {
                transform: translateY(0) scaleY(0);
                opacity: 0;
            }

            50% {
                opacity: 1;
                transform: translateY(-100px) scaleY(1);
            }

            100% {
                transform: translateY(-200px) scaleY(0);
                opacity: 0;
            }
        }

        .holo-particle:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .holo-particle:nth-child(2) {
            left: 30%;
            animation-delay: 0.5s;
        }

        .holo-particle:nth-child(3) {
            left: 50%;
            animation-delay: 1s;
        }

        .holo-particle:nth-child(4) {
            left: 70%;
            animation-delay: 1.5s;
        }

        .holo-particle:nth-child(5) {
            left: 90%;
            animation-delay: 2s;
        }

        @media (max-width: 768px) {
            .holo-categories {
                flex-direction: column;
                gap: 1rem;
            }

            .holo-badge {
                padding: 0.8rem 1.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="hero">
        <div class="holo-frame">
            <!-- Frame Borders -->
            <div class="holo-border border-top"></div>
            <div class="holo-border border-bottom"></div>
            <div class="holo-border border-left"></div>
            <div class="holo-border border-right"></div>

            <!-- Corner Brackets -->
            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>

            <!-- Scanline -->
            <div class="scanline"></div>

            <!-- Content -->
            <div class="holo-content">
                <h1 class="holo-title">
                    <span>N</span><span>C</span><span>O</span><span>R</span><span>E</span>
                    <br>
                    <span>G</span><span>A</span><span>M</span><span>I</span><span>N</span><span>G</span>
                </h1>

                <div class="holo-categories">
                    <div class="holo-badge">თამაშები</div>
                    <div class="holo-badge">ტექნოლოგია</div>
                    <div class="holo-badge">ინოვაცია</div>
                </div>
            </div>

            <!-- Holographic Particles -->
            <div class="holo-particle"></div>
            <div class="holo-particle"></div>
            <div class="holo-particle"></div>
            <div class="holo-particle"></div>
            <div class="holo-particle"></div>
        </div>
    </div>
</body>

</html>
