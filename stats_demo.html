<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActivePlayer.io Live Stats</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #00f0ff;
            --secondary: #7000ff;
            --bg: #050505;
            --panel: #0a0a0a;
            --text: #ffffff;
            --accent: #ff003c;
            --gold: #ffd700;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .stats-container {
            width: 100%;
            max-width: 1200px;
            background: var(--panel);
            border: 1px solid #1a1a1a;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .stats-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }

        .header {
            padding: 2rem;
            border-bottom: 2px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, #0a0a0a, #111);
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            margin: 0;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .title span {
            color: var(--accent);
        }

        .live-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 5px 12px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 0, 60, 0.05);
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.1);
            transition: 0.3s;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--accent);
            animation: blinker 1s infinite cubic-bezier(0.5, 0, 1, 1);
        }

        @keyframes blinker {
            50% {
                opacity: 0;
            }
        }

        /* TABLE */
        .games-list {
            display: flex;
            flex-direction: column;
        }

        .game-row {
            display: grid;
            grid-template-columns: 60px 1fr 150px 180px;
            padding: 20px 30px;
            border-bottom: 1px solid #1a1a1a;
            align-items: center;
            transition: 0.2s;
            position: relative;
        }

        .game-row:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .rank {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: #444;
            font-weight: bold;
        }

        .rank.top-1 {
            color: var(--gold);
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .rank.top-2 {
            color: #c0c0c0;
            text-shadow: 0 0 15px rgba(192, 192, 192, 0.4);
        }

        .rank.top-3 {
            color: #cd7f32;
            text-shadow: 0 0 15px rgba(205, 127, 50, 0.4);
        }

        .game-info {
            display: flex;
            flex-direction: column;
        }

        .game-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #eee;
            margin-bottom: 4px;
        }

        .game-meta {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .live-label {
            color: var(--primary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.8;
            text-align: right;
            padding-right: 20px;
        }

        .player-count {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            text-align: right;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
        }

        .count-change {
            font-size: 0.8rem;
            font-family: 'Rajdhani', sans-serif;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .up {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }

        .down {
            color: #ff003c;
            background: rgba(255, 0, 60, 0.1);
        }

        @media (max-width: 768px) {
            .game-row {
                grid-template-columns: 40px 1fr;
                grid-template-rows: auto auto;
                padding: 15px;
            }

            .live-label {
                display: none;
            }

            .player-count {
                grid-column: 2;
                grid-row: 2;
                text-align: left;
                justify-content: flex-start;
                font-size: 1.4rem;
                margin-top: 5px;
            }

            .rank {
                grid-row: 1 /span 2;
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>

    <div class="stats-container">
        <div class="header">
            <h1 class="title">TOP 15 <span>LIVE</span> GAMES</h1>
            <div class="live-badge" id="live-badge"><span class="live-dot"></span> REAL-TIME DATA</div>
        </div>

        <div class="games-list" id="games-list">
            <!-- JS Renders Here -->
        </div>
    </div>

    <script>
        // Initial Estimated Data
        let games = [
            { name: "Roblox", count: 7424850, category: "Sandbox" },
            { name: "Fortnite", count: 1300032, category: "Battle Royale" },
            { name: "Counter-Strike 2", count: 1284449, category: "Shooter" },
            { name: "Minecraft", count: 1236000, category: "Sandbox" },
            { name: "League of Legends", count: 1105400, category: "MOBA" },
            { name: "Valorant", count: 895300, category: "Shooter" },
            { name: "Dota 2", count: 608826, category: "MOBA" },
            { name: "PUBG: Battlegrounds", count: 512300, category: "Battle Royale" },
            { name: "Apex Legends", count: 320500, category: "Battle Royale" },
            { name: "Call of Duty: MW3/WZ", count: 255400, category: "Shooter" },
            { name: "Genshin Impact", count: 210300, category: "RPG" },
            { name: "Grand Theft Auto V", count: 182400, category: "Action" },
            { name: "Overwatch 2", count: 155600, category: "Shooter" },
            { name: "Rocket League", count: 125800, category: "Sports" },
            { name: "Naraka: Bladepoint", count: 105200, category: "Action" }
        ];

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function renderGames() {
            // Sort by count descending
            games.sort((a, b) => b.count - a.count);

            const container = document.getElementById('games-list');
            let html = '';

            games.forEach((game, index) => {
                const rank = index + 1;
                let rankClass = "";
                if (rank === 1) rankClass = "top-1";
                if (rank === 2) rankClass = "top-2";
                if (rank === 3) rankClass = "top-3";

                html += `
                    <div class="game-row" id="row-${index}">
                        <div class="rank ${rankClass}">#${rank}</div>
                        <div class="game-info">
                            <div class="game-name">${game.name}</div>
                            <div class="game-meta">${game.category}</div>
                        </div>
                        <div class="live-label">Online Now</div>
                        <div class="player-count">
                            <span id="count-${index}">${formatNumber(game.count)}</span>
                            <span class="count-change" id="change-${index}"></span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Fetch Official & Estimated Stats from PHP Proxy every 60s
        async function fetchOfficialStats() {
            try {
                const response = await fetch('get_stats_activeplayer.php');
                const data = await response.json();

                let updated = false;
                games.forEach(game => {
                    // Fuzzy match names (e.g. "Counter-Strike 2" matches "Counter-Strike 2" or "CS2")
                    for (const [key, value] of Object.entries(data)) {
                        if (game.name.toLowerCase().includes(key.toLowerCase()) || key.toLowerCase().includes(game.name.toLowerCase())) {
                            // If difference is significant/new, update
                            if (Math.abs(game.count - value) > 10) {
                                game.count = value;
                                updated = true;
                            }
                            break;
                        }
                    }
                });

                if (updated) {
                    renderGames();

                    // Flash "UPDATED" badge
                    const badge = document.getElementById('live-badge');
                    if (badge) {
                        const original = '<span class="live-dot"></span> REAL-TIME DATA';
                        badge.style.borderColor = '#00ff88';
                        badge.style.color = '#00ff88';
                        badge.innerHTML = '<i class="fas fa-sync fa-spin"></i> UPDATED';

                        setTimeout(() => {
                            badge.style.borderColor = '#ff003c';
                            badge.style.color = '#ff003c';
                            badge.innerHTML = original;
                        }, 2000);
                    }
                }

            } catch (error) {
                console.error("Fetch failed:", error);
            }
        }

        // Simulate small fluctuation every second (ActivePlayer style)
        function startLiveUpdates() {
            setInterval(() => {
                const numUpdates = Math.floor(Math.random() * 3) + 2;

                for (let i = 0; i < numUpdates; i++) {
                    const index = Math.floor(Math.random() * games.length);
                    const game = games[index];

                    const volatility = game.count > 1000000 ? 500 : 50;
                    const change = Math.floor(Math.random() * (volatility * 2)) - volatility;

                    if (change === 0) continue;

                    game.count += change;
                    if (game.count < 0) game.count = 0;

                    const countEl = document.getElementById(`count-${index}`);
                    const changeEl = document.getElementById(`change-${index}`);

                    if (countEl) countEl.innerText = formatNumber(game.count);

                    if (changeEl) {
                        const icon = change > 0 ? '▲' : '▼';
                        const cls = change > 0 ? 'up' : 'down';
                        changeEl.className = `count-change ${cls}`;
                        changeEl.innerHTML = `${icon} ${Math.abs(change)}`;
                        setTimeout(() => {
                            if (changeEl) changeEl.innerHTML = '';
                        }, 1500);
                    }
                }
            }, 1000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderGames();
            startLiveUpdates();      // Visual "breathing"
            fetchOfficialStats();    // Initial real fetch
            setInterval(fetchOfficialStats, 60000); // Re-sync every 60s
        });

    </script>
</body>

</html>
