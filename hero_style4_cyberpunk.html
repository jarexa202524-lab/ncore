<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STYLE 4: Cyberpunk HUD - NCORE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #00ff88;
            overflow: hidden;
        }

        :root {
            --primary: #00ff88;
            --secondary: #00d4ff;
            --accent: #ff0080;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background:
                repeating-linear-gradient(0deg, rgba(0, 255, 136, 0.02) 0px, transparent 1px, transparent 2px, rgba(0, 255, 136, 0.02) 3px),
                repeating-linear-gradient(90deg, rgba(0, 255, 136, 0.02) 0px, transparent 1px, transparent 2px, rgba(0, 255, 136, 0.02) 3px);
        }

        /* HUD Container */
        .hud-container {
            position: relative;
            max-width: 900px;
            padding: 3rem;
        }

        /* Terminal Window */
        .terminal {
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid var(--primary);
            border-radius: 0;
            padding: 2rem;
            position: relative;
            box-shadow:
                0 0 30px rgba(0, 255, 136, 0.5),
                inset 0 0 30px rgba(0, 255, 136, 0.1);
            clip-path: polygon(0 0,
                    calc(100% - 20px) 0,
                    100% 20px,
                    100% 100%,
                    20px 100%,
                    0 calc(100% - 20px));
        }

        /* Terminal Header */
        .terminal-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: var(--primary);
            display: flex;
            align-items: center;
            padding: 0 1rem;
            font-weight: bold;
            color: #000;
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 0 100%);
        }

        .terminal-header::before {
            content: '▸ SYSTEM.NCORE.MAIN';
            letter-spacing: 2px;
        }

        .terminal-dots {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #000;
        }

        /* Content */
        .terminal-content {
            margin-top: 50px;
        }

        /* Typing Title */
        .typing-title {
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 1rem;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid var(--primary);
            animation: typing 3s steps(40) infinite, blink 0.75s step-end infinite;
        }

        @keyframes typing {

            0%,
            90%,
            100% {
                width: 100%;
            }

            45% {
                width: 0%;
            }
        }

        @keyframes blink {

            0%,
            50% {
                border-color: transparent;
            }

            100% {
                border-color: var(--primary);
            }
        }

        /* Status Lines */
        .status-line {
            font-size: 1.3rem;
            margin: 1.5rem 0;
            display: flex;
            align-items: center;
            gap: 1rem;
            animation: fadeInUp 1s ease-in-out;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-line:nth-child(2) {
            animation-delay: 0.3s;
        }

        .status-line:nth-child(3) {
            animation-delay: 0.6s;
        }

        .status-line:nth-child(4) {
            animation-delay: 0.9s;
        }

        .prompt {
            color: var(--secondary);
            font-weight: bold;
        }

        .value {
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
        }

        /* Progress Bar */
        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid var(--primary);
            position: relative;
            margin-top: 2rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            animation: progressLoad 3s ease-in-out infinite;
            box-shadow: 0 0 20px var(--primary);
        }

        @keyframes progressLoad {
            0% {
                width: 0%;
            }

            50% {
                width: 100%;
            }

            100% {
                width: 0%;
            }
        }

        /* Category Tags */
        .category-tags {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .tag {
            padding: 0.8rem 1.5rem;
            background: transparent;
            border: 2px solid var(--secondary);
            color: var(--secondary);
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            clip-path: polygon(5px 0, 100% 0, calc(100% - 5px) 100%, 0 100%);
        }

        .tag::before {
            content: '//';
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent);
        }

        .tag:hover {
            background: var(--secondary);
            color: #000;
            box-shadow: 0 0 20px var(--secondary);
            transform: translateX(5px);
        }

        /* Corner Indicators */
        .corner-indicator {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 3px solid var(--accent);
        }

        .indicator-tl {
            top: -30px;
            left: -30px;
            border-right: none;
            border-bottom: none;
        }

        .indicator-tr {
            top: -30px;
            right: -30px;
            border-left: none;
            border-bottom: none;
        }

        .indicator-bl {
            bottom: -30px;
            left: -30px;
            border-right: none;
            border-top: none;
        }

        .indicator-br {
            bottom: -30px;
            right: -30px;
            border-left: none;
            border-top: none;
        }

        /* Glitch Effect */
        .glitch {
            position: relative;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 var(--accent);
            animation: glitch-1 2s infinite;
        }

        .glitch::after {
            left: -2px;
            text-shadow: 2px 0 var(--secondary);
            animation: glitch-2 2.5s infinite;
        }

        @keyframes glitch-1 {

            0%,
            90%,
            100% {
                clip-path: inset(0);
            }

            92% {
                clip-path: inset(50% 0 0 0);
            }

            94% {
                clip-path: inset(0 0 80% 0);
            }
        }

        @keyframes glitch-2 {

            0%,
            90%,
            100% {
                clip-path: inset(0);
            }

            91% {
                clip-path: inset(0 0 70% 0);
            }

            93% {
                clip-path: inset(30% 0 0 0);
            }
        }

        /* Scanline Overlay */
        .scanline-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 0, 0, 0.15),
                    rgba(0, 0, 0, 0.15) 1px,
                    transparent 1px,
                    transparent 2px);
            pointer-events: none;
            animation: scanlines 10s linear infinite;
        }

        @keyframes scanlines {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(10px);
            }
        }

        @media (max-width: 768px) {
            .terminal {
                padding: 1.5rem;
            }

            .category-tags {
                flex-direction: column;
            }

            .status-line {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="hero">
        <div class="hud-container">
            <!-- Corner Indicators -->
            <div class="corner-indicator indicator-tl"></div>
            <div class="corner-indicator indicator-tr"></div>
            <div class="corner-indicator indicator-bl"></div>
            <div class="corner-indicator indicator-br"></div>

            <!-- Terminal -->
            <div class="terminal">
                <!-- Scanline Overlay -->
                <div class="scanline-overlay"></div>

                <!-- Terminal Header -->
                <div class="terminal-header">
                    <div class="terminal-dots">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>

                <!-- Content -->
                <div class="terminal-content">
                    <h1 class="typing-title glitch" data-text=">_ NCORE GAMING">>_ NCORE GAMING</h1>

                    <div class="status-line">
                        <span class="prompt">▸ STATUS:</span>
                        <span class="value">ONLINE</span>
                    </div>

                    <div class="status-line">
                        <span class="prompt">▸ SYSTEM:</span>
                        <span class="value">ACTIVE</span>
                    </div>

                    <div class="status-line">
                        <span class="prompt">▸ ACCESS:</span>
                        <span class="value">GRANTED</span>
                    </div>

                    <!-- Progress Bar -->
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>

                    <!-- Category Tags -->
                    <div class="category-tags">
                        <div class="tag">თამაშები</div>
                        <div class="tag">ტექნოლოგია</div>
                        <div class="tag">ინოვაცია</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
